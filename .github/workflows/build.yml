name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.buildtype }} / sdl=${{ matrix.sdl }}
    runs-on: ubuntu-latest
    # Arch has the compilers needed for C++23, and it is what the AUR
    # package is built on
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        buildtype: [debug, release]
        sdl: [enabled]
        include:
          # The configuration used on CryptixOS, fbdev only
          - compiler: gcc
            buildtype: debugoptimized
            sdl: disabled

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf clang lld fmt sdl2

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and install Prism
        run: .github/scripts/install-prism.sh

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            export CC=clang CXX=clang++
          fi
          meson setup build \
            --buildtype=${{ matrix.buildtype }} \
            -Dsdl=${{ matrix.sdl }}

      - name: Build
        run: meson compile -C build

      - name: Install
        run: DESTDIR="$PWD/staging" meson install -C build

      - name: Upload binary
        if: matrix.buildtype == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: quantum-term-${{ matrix.compiler }}-sdl-${{ matrix.sdl }}
          path: staging/
          if-no-files-found: error
