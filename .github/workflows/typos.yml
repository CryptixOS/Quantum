name: Spelling

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CLICOLOR: 1

jobs:
  spelling:
    name: Spell check with typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Spell check
        uses: crate-ci/typos@v1.30.0
